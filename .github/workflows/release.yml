name: Release

# Patch-line versioning + GitHub Releases. The version lives in the root
# package.json. No binary assets: desktop.grok.me deploys from Vercel and the
# local host ships with Spanreed.
#
#   * release-pr — after a PR into master is merged (or workflow_dispatch):
#                  opens/updates the release PR `release-plz-v<next>` that bumps
#                  package.json to the next PATCH and writes the CHANGELOG
#                  section via release-changelog-action@v1. Only feat/fix
#                  commits since the last tag trigger it.
#   * release    — when a release PR (head `release-plz-*`) is merged (or
#                  workflow_dispatch): tags `v<package.json version>` at the
#                  merge commit if untagged and publishes the GitHub Release
#                  from the CHANGELOG section.

on:
  pull_request:
    types: [closed]
    branches: [master]
  workflow_dispatch:
    inputs:
      force:
        description: Open the release PR even without feat/fix commits
        required: false
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  release-pr:
    name: release PR (patch line)
    if: >
      github.repository_owner == 'grok-insider'
      && (github.event_name == 'workflow_dispatch'
          || (github.event_name == 'pull_request'
              && github.event.pull_request.merged == true
              && !startsWith(github.event.pull_request.head.ref, 'release-plz-')))
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    concurrency:
      group: release-pr
      cancel-in-progress: false
    env:
      GH_TOKEN: ${{ secrets.RELEASE_PLZ_TOKEN || secrets.GITHUB_TOKEN }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.merge_commit_sha || github.sha }}
          persist-credentials: true
          token: ${{ secrets.RELEASE_PLZ_TOKEN || secrets.GITHUB_TOKEN }}

      - name: Decide the next version
        id: decide
        env:
          FORCE: ${{ inputs.force == true && 'true' || 'false' }}
        run: |
          set -euo pipefail
          current="$(jq -r '.version' package.json)"
          if [[ ! "$current" =~ ^([0-9]+)\.([0-9]+)\.([0-9]+)$ ]]; then
            echo "::error::package.json version '$current' is not x.y.z."
            exit 1
          fi
          major="${BASH_REMATCH[1]}" minor="${BASH_REMATCH[2]}" patch="${BASH_REMATCH[3]}"
          if ! git rev-parse -q --verify "refs/tags/v${current}" >/dev/null; then
            echo "::notice::v${current} is not tagged yet; the release job tags it. No new release PR."
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ "$FORCE" != "true" ] \
            && ! git log "v${current}..HEAD" --no-merges --format=%s \
               | grep -qE '^(feat|fix)(\(.*\))?!?:'; then
            echo "::notice::no feat/fix commits since v${current}; nothing to release."
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          breaking=false
          if git log "v${current}..HEAD" --no-merges --format='%s%n%b' \
            | grep -qE '^[a-z]+(\(.*\))?!:|^BREAKING CHANGE'; then
            breaking=true
          fi
          next="${major}.${minor}.$(( patch + 1 ))"
          {
            echo "skip=false"
            echo "current=$current"
            echo "next=$next"
            echo "breaking=$breaking"
          } >> "$GITHUB_OUTPUT"

      - name: Bump the package version
        if: ${{ steps.decide.outputs.skip == 'false' }}
        env:
          NEXT: ${{ steps.decide.outputs.next }}
        run: |
          set -euo pipefail
          npm version "$NEXT" --no-git-tag-version --allow-same-version
          if git diff --quiet -- package.json; then
            echo "::error::Version bump produced no package.json change."
            exit 1
          fi

      - name: Generate the AI changelog section
        if: ${{ steps.decide.outputs.skip == 'false' }}
        uses: grok-insider/release-changelog-action@v1
        with:
          version: ${{ steps.decide.outputs.next }}
          range: v${{ steps.decide.outputs.current }}..HEAD
          openrouter-api-key: ${{ secrets.OPENROUTER_API_KEY }}
          project-description: "Grok Desktop Portable: the desktop.grok.me Work UI that drives the user's Grok Build CLI through the local Spanreed agent host, plus the Spanreed installers"

      - name: Open or update the release PR
        if: ${{ steps.decide.outputs.skip == 'false' }}
        env:
          CURRENT: ${{ steps.decide.outputs.current }}
          NEXT: ${{ steps.decide.outputs.next }}
          BREAKING: ${{ steps.decide.outputs.breaking }}
        run: |
          set -euo pipefail
          branch="release-plz-v${NEXT}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -c "$branch"
          git add package.json CHANGELOG.md
          if ! git diff --quiet -- pnpm-lock.yaml; then
            git add pnpm-lock.yaml
          fi
          git commit -m "chore: release v${NEXT}"
          git push --force --set-upstream origin "$branch"

          gh label create release --color 0e8a16 \
            --description "release PRs (auto patch line + manual bumps)" \
            2>/dev/null || true

          body="$(mktemp)"
          {
            echo "Automated patch-line release PR: **v${CURRENT} -> v${NEXT}**."
            echo
            echo "Bumps the \`package.json\` version and adds the AI-generated"
            echo "\`CHANGELOG.md\` section for the commits since v${CURRENT}."
            echo "Regenerated from master on every push until merged."
            echo
            if [ "$BREAKING" = "true" ]; then
              echo "**WARNING: breaking commits (\`!\`/\`BREAKING CHANGE\`) landed since"
              echo "v${CURRENT}.** The automatic stream still bumps the patch component;"
              echo "if this deserves a minor milestone instead, close this PR and run the"
              echo "Manual Version Bump workflow."
              echo
            fi
            echo "Merging tags \`v${NEXT}\` at the merge commit and publishes the GitHub"
            echo "Release from the CHANGELOG section. No binary assets."
          } > "$body"

          existing="$(gh pr list --state open --head "$branch" --json number --jq '.[0].number // empty')"
          if [ -n "$existing" ]; then
            gh pr edit "$existing" --title "chore: release v${NEXT}" --body-file "$body"
          else
            gh pr create \
              --base master \
              --head "$branch" \
              --title "chore: release v${NEXT}" \
              --body-file "$body" \
              --label release
          fi

          for stale in $(gh pr list --state open --label release --json number,headRefName \
            --jq ".[] | select(.headRefName != \"$branch\" and (.headRefName | startswith(\"release-plz-v\"))) | .number"); do
            gh pr close "$stale" --comment "Superseded by the release PR for v${NEXT}." --delete-branch
          done

  release:
    name: tag and GitHub Release
    if: >
      github.repository_owner == 'grok-insider'
      && (github.event_name == 'workflow_dispatch'
          || (github.event_name == 'pull_request'
              && github.event.pull_request.merged == true
              && startsWith(github.event.pull_request.head.ref, 'release-plz-')))
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: release
      cancel-in-progress: false
    env:
      GH_TOKEN: ${{ secrets.RELEASE_PLZ_TOKEN || secrets.GITHUB_TOKEN }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.merge_commit_sha || github.sha }}
          persist-credentials: true
          token: ${{ secrets.RELEASE_PLZ_TOKEN || secrets.GITHUB_TOKEN }}

      - name: Tag the package.json version
        id: tag
        run: |
          set -euo pipefail
          version="$(jq -r '.version' package.json)"
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::package.json version '$version' is not x.y.z."
            exit 1
          fi
          tag="v${version}"
          {
            echo "version=$version"
            echo "tag=$tag"
          } >> "$GITHUB_OUTPUT"
          if git rev-parse -q --verify "refs/tags/${tag}" >/dev/null; then
            echo "::notice::${tag} already exists; nothing to release."
            echo "created=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if ! grep -qE "^## \[?${version//./\\.}\]?( |$)" CHANGELOG.md; then
            echo "::error::CHANGELOG.md has no section for ${version}."
            exit 1
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "$tag" -m "$tag" HEAD
          git push origin "refs/tags/${tag}"
          echo "created=true" >> "$GITHUB_OUTPUT"

      - name: Publish the CHANGELOG section as the GitHub Release
        id: notes
        if: ${{ steps.tag.outputs.created == 'true' }}
        uses: grok-insider/release-changelog-action@v1
        with:
          version: ${{ steps.tag.outputs.version }}
          tag: ${{ steps.tag.outputs.tag }}
          skip-generate: true
          publish-github-release: true
          create-if-missing: true
          github-token: ${{ secrets.RELEASE_PLZ_TOKEN || secrets.GITHUB_TOKEN }}
          notes-footer-file: site/release-footer.md

      - name: Verify the GitHub Release exists
        if: ${{ steps.tag.outputs.created == 'true' }}
        env:
          TAG: ${{ steps.tag.outputs.tag }}
          PUBLISHED: ${{ steps.notes.outputs.published }}
        run: |
          set -euo pipefail
          if [ "$PUBLISHED" != "true" ] || ! gh release view "$TAG" >/dev/null 2>&1; then
            echo "::error::GitHub Release ${TAG} was not published."
            exit 1
          fi
