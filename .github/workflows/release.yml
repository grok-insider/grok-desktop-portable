name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            asset: grok-bridge-linux-x64
          - os: windows-latest
            asset: grok-bridge-windows-x64.exe
          - os: macos-latest
            asset: grok-bridge-darwin-arm64
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
      - run: pnpm install --frozen-lockfile
      # SPA must land in apps/web/dist for crates/grok-bridge/build.rs embed.
      - name: Build Work SPA for embed
        run: pnpm build:web:dist
      - name: Release build
        run: cargo build -p grok-bridge --release
      - name: Assert SPA embedded (fail closed)
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${{ runner.os }}" == "Windows" ]]; then
            BIN="target/release/grok-bridge.exe"
          else
            BIN="target/release/grok-bridge"
          fi
          bash scripts/assert-spa-embedded.sh "$BIN"
      - name: Stage asset
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist-release
          if [[ "${{ runner.os }}" == "Windows" ]]; then
            cp "target/release/grok-bridge.exe" "dist-release/${{ matrix.asset }}"
          else
            cp "target/release/grok-bridge" "dist-release/${{ matrix.asset }}"
            chmod +x "dist-release/${{ matrix.asset }}"
            strip "dist-release/${{ matrix.asset }}" || true
            bash scripts/assert-spa-embedded.sh "dist-release/${{ matrix.asset }}"
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset }}
          path: dist-release/${{ matrix.asset }}

  publish:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Collect assets and checksums
        run: |
          set -euo pipefail
          mkdir -p release
          find artifacts -type f -print0 | while IFS= read -r -d '' f; do
            cp "$f" "release/$(basename "$f")"
          done
          cd release
          sha256sum * | tee checksums.txt
          test -s checksums.txt
          # Expected asset names for the beta matrix.
          for a in grok-bridge-linux-x64 grok-bridge-windows-x64.exe grok-bridge-darwin-arm64; do
            test -f "$a"
          done
          ls -la
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          draft: false
          prerelease: ${{ contains(github.ref_name, 'beta') || contains(github.ref_name, 'rc') }}
          generate_release_notes: true
          files: release/*
          body: |
            **Grok Desktop Portable** — `grok-bridge` only.

            Install:
            ```sh
            curl -fsSL https://desktop.grok.me/install.sh | sh
            ```
            Windows: `irm https://desktop.grok.me/install.ps1 | iex`

            Verify SHA-256 against `checksums.txt`. Builds are unsigned FOSS.

            Requirements: Grok Build CLI ≥ 0.2.115, Chromium or Firefox 84+.
            Safari is unsupported.
