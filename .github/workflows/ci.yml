name: CI

# Status checks run on pull requests only — not on bare pushes to master/dev.
# Optional rebuilds: v* tags and workflow_dispatch.

on:
  pull_request:
    types: [opened, synchronize, reopened, closed]
  push:
    tags: ["v*"]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  web:
    name: web
    if: >
      github.event_name == 'workflow_dispatch'
      || github.event_name == 'push'
      || (github.event_name == 'pull_request' && github.event.action != 'closed')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck:web
      - run: pnpm test:web
      - run: pnpm build:web
      - run: pnpm test:public
      - run: pnpm test:embed
      - run: pnpm test:install
      - uses: actions/upload-artifact@v4
        with:
          name: web-dist
          path: apps/web/dist
          retention-days: 3

  rust:
    name: fmt + clippy + test
    if: >
      github.event_name == 'workflow_dispatch'
      || github.event_name == 'push'
      || (github.event_name == 'pull_request' && github.event.action != 'closed')
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - run: pnpm install --frozen-lockfile
      - run: pnpm build:web
      - name: cargo fmt
        if: matrix.os == 'ubuntu-latest'
        run: cargo fmt --all --check
      - name: cargo clippy
        if: matrix.os == 'ubuntu-latest'
        run: cargo clippy -p grok-bridge --all-targets -- -D warnings
      - name: cargo test
        run: |
          cargo build -p grok-bridge --example fake_agent
          cargo test -p grok-bridge

  nix:
    name: nix build + cache push (x86_64-linux)
    if: >
      github.event_name == 'workflow_dispatch'
      || (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v'))
      || (github.event_name == 'pull_request'
          && github.event.action == 'closed'
          && github.event.pull_request.merged == true
          && github.event.pull_request.base.ref == 'master')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.merge_commit_sha || github.sha }}

      - name: Install Nix
        uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes
            accept-flake-config = true

      - name: Build grok-bridge
        run: nix build .#grok-bridge -L

      - name: Push to cache.fabrials.com
        env:
          ATTIC_TOKEN: ${{ secrets.ATTIC_TOKEN }}
        run: |
          if [ -z "$ATTIC_TOKEN" ]; then echo "::warning::ATTIC_TOKEN not set; skipping push"; exit 0; fi
          nix profile install --inputs-from . nixpkgs#attic-client
          attic login fabrials https://cache.fabrials.com "$ATTIC_TOKEN"
          mapfile -t paths < <(nix build .#grok-bridge --no-link --print-out-paths)
          attic push fabrials "${paths[@]}"
