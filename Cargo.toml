[workspace]
resolver = "2"
members = ["crates/grok-bridge"]

[workspace.package]
version = "0.1.1"
edition = "2024"
license = "AGPL-3.0-or-later"
# Do NOT set `publish = false` here. release-plz skips manifest-unpublishable
# packages entirely (no git tag / GitHub Release). Crates.io is gated only in
# release-plz.toml (`git_only = true`, `publish = false`).
rust-version = "1.95"

[workspace.dependencies]
async-trait = "0.1.89"
cap-std = "4.0.2"
fs2 = "0.4.3"
getrandom = "0.4.3"
git2 = { version = "0.20.4", default-features = false }
rustix = { version = "1.1.4", default-features = false, features = ["process", "std"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
sha2 = "0.10.9"
similar = "2.7.0"
thiserror = "2.0.18"
tokio = { version = "1.49.0", features = ["io-util", "macros", "net", "process", "rt-multi-thread", "signal", "sync", "time"] }
url = "2.5.7"
zeroize = "1.8.2"

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[workspace.lints.clippy]
# Style/pedantic noise is allowed for the v0 snapshot so the split is not
# blocked by clippy version drift against the monorepo tip. Tighten later.
all = { level = "warn", priority = -1 }
pedantic = { level = "allow", priority = -1 }
collapsible_if = "allow"
too_many_lines = "allow"
doc_markdown = "allow"
unnested_or_patterns = "allow"
match_same_arms = "allow"
format_collect = "allow"
manual_duration = "allow"
missing_errors_doc = "allow"
